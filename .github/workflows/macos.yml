name: macos

# Builds Dex for macOS: an unsigned .dmg for Apple Silicon and one for Intel
# (#36). A published release gets both attached. A pull request or a push to
# master that touches anything that goes into the app builds them too, as
# workflow artifacts, so a broken Mac build shows up before a release does.
# Run by hand with a tag (v0.4.0), it builds that tag and attaches to its
# release; without one it only builds.
on:
  release:
    types: [published]
  pull_request:
    paths:
      - .github/workflows/macos.yml
      - app/**
      - crates/**
      - skills/**
      - Cargo.toml
      - Cargo.lock
  push:
    branches: [master]
    paths:
      - .github/workflows/macos.yml
      - app/**
      - crates/**
      - skills/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to, e.g. v0.4.0. Empty builds this branch and attaches nothing.
        required: false
        default: ""

# Building runs every dependency's build script; none of it gets a token that
# can write. Only `attach`, which runs no project code, can.
permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: apple-silicon
            lipo: arm64
          - target: x86_64-apple-darwin
            arch: intel
            lipo: x86_64
    # An Apple Silicon runner builds both; Intel is cross-compiled.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
          persist-credentials: false

      # A release named for one version must not ship another's app.
      - name: The tag is the app's version
        if: env.TAG != ''
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::The tag is $TAG but the app at that tag is version $version."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend install
        working-directory: app
        run: npm ci

      # tauri.macos.conf.json stages dex and dex-mcp for the same target.
      - name: Build
        working-directory: app
        run: npx tauri build --target ${{ matrix.target }}

      - name: Name the image
        id: dmg
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          built=$(ls target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          named="Dex_${version}_macos_${{ matrix.arch }}.dmg"
          mv "$built" "$named"
          shasum -a 256 "$named"
          echo "path=$named" >> "$GITHUB_OUTPUT"

      # The bundle holds what it should, each piece runs, and it verifies.
      - name: Check the bundle
        run: |
          app=target/${{ matrix.target }}/release/bundle/macos/Dex.app
          ls -l "$app/Contents/MacOS" "$app/Contents/Resources/skills/dex-agentic/SKILL.md"
          codesign --verify --deep --strict "$app"
          for bin in dex-app dex dex-mcp; do
            lipo "$app/Contents/MacOS/$bin" -verify_arch ${{ matrix.lipo }}
          done
          "$app/Contents/MacOS/dex" --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dmg.outputs.path }}
          path: ${{ steps.dmg.outputs.path }}

  attach:
    needs: dmg
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Dex_*_macos_*.dmg
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" Dex_*_macos_*.dmg --clobber
