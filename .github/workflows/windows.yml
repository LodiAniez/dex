name: windows

# Builds the Windows installer (an unsigned .msi) on GitHub, as `macos.yml`
# does the Mac images: releases used to take an MSI built on the owner's
# machine, where Smart App Control now refuses what a fresh Rust build
# compiles. A published release gets the MSI attached. A pull request or a
# push to master that touches anything that goes into the app builds it too,
# as a workflow artifact. Run by hand with a tag (v0.5.0), it builds that tag
# and attaches to its release; without one it only builds.
on:
  release:
    types: [published]
  pull_request:
    paths:
      - .github/workflows/windows.yml
      - app/**
      - crates/**
      - skills/**
      - Cargo.toml
      - Cargo.lock
  push:
    branches: [master]
    paths:
      - .github/workflows/windows.yml
      - app/**
      - crates/**
      - skills/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to, e.g. v0.5.0. Empty builds this branch and attaches nothing.
        required: false
        default: ""

# Building runs every dependency's build script; none of it gets a token that
# can write. Only `attach`, which runs no project code, can.
permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  msi:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
          persist-credentials: false

      # A release named for one version must not ship another's app.
      - name: The tag is the app's version
        if: env.TAG != ''
        run: |
          $version = node -p "require('./app/src-tauri/tauri.conf.json').version"
          if ("v$version" -ne $env:TAG) {
            Write-Output "::error::The tag is $env:TAG but the app at that tag is version $version."
            exit 1
          }

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # WiX, which Tauri downloads on first use: from GitHub, every build otherwise.
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-tools-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
          restore-keys: tauri-tools-${{ runner.os }}-

      - name: Frontend install
        working-directory: app
        run: npm ci

      # tauri.conf.json's beforeBuildCommand builds dex and dex-mcp beside the
      # app, where the installer's fragment (wix/dex.wxs) picks them up.
      - name: Build
        working-directory: app
        run: npx tauri build

      - name: Find the installer
        id: msi
        run: |
          # Exactly one: a second would mean a version or language nobody meant to ship.
          $built = @(Get-ChildItem target/release/bundle/msi/*.msi)
          if ($built.Count -ne 1) {
            Write-Output "::error::Expected one installer, found $($built.Count): $($built.Name -join ', ')"
            exit 1
          }
          $built = $built[0]
          (Get-FileHash $built.FullName -Algorithm SHA256).Hash + "  " + $built.Name
          "path=$($built.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($built.Name)" >> $env:GITHUB_OUTPUT

      # What the installer lays down, unpacked without installing: the app,
      # the CLI and the MCP server beside it, the skill, and a CLI that runs.
      - name: Check the installer
        run: |
          $out = Join-Path $env:RUNNER_TEMP "msi"
          $unpack = Start-Process msiexec.exe -ArgumentList "/a `"${{ steps.msi.outputs.path }}`" /qn TARGETDIR=`"$out`"" -Wait -PassThru
          if ($unpack.ExitCode -ne 0) { Write-Output "::error::msiexec could not unpack the installer: exit $($unpack.ExitCode)"; exit 1 }
          $dir = Get-ChildItem -Recurse $out -Filter dex-app.exe | Select-Object -First 1 | ForEach-Object DirectoryName
          foreach ($file in "dex-app.exe", "dex.exe", "dex-mcp.exe", "skills\dex-agentic\SKILL.md") {
            if (-not (Test-Path (Join-Path $dir $file))) { Write-Output "::error::$file is not in the installer"; exit 1 }
          }
          & (Join-Path $dir "dex.exe") --version
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::The installer's dex.exe does not run"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.msi.outputs.name }}
          path: ${{ steps.msi.outputs.path }}

  attach:
    needs: msi
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Dex_*.msi
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" Dex_*.msi --clobber
