[package]
name = "dex-cli"
description = "The `dex` command-line client and Claude Code hook entry point."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "dex"
path = "src/main.rs"

[dependencies]
clap.workspace = true
dex-protocol.workspace = true
getrandom.workspace = true
hmac.workspace = true
serde.workspace = true
# preserve_order: `dex hooks` rewrites the owner's Claude Code settings and must
# keep their keys in the order they wrote them.
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
